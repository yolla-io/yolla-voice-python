[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yolla-voice-python"
version = "0.1.0"
description = "Python server SDK for the Yolla Voice Reseller API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
    "coverage>=7.6",
    "datamodel-code-generator[jinja2,ruff]>=0.26",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.sdist]
# Explicit allowlist: local tool state and agent files never ship.
only-include = [
    "CHANGELOG.md",
    "LICENSE",
    "README.md",
    "examples",
    "openapi",
    "scripts",
    "src",
    "tests",
    "uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yolla_voice"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["yolla_voice"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
# Test bodies are type-checked against the public API; test functions and fixtures
# themselves do not need annotations.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true
disable_error_code = ["var-annotated"]
