[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yolla-voice-python"
version = "0.1.0"
description = "Python server SDK for the Yolla Voice Reseller API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
    "coverage>=7.6",
    "datamodel-code-generator[jinja2,ruff]>=0.26",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yolla_voice"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
